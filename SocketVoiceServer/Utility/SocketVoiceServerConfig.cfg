#
# Configuration file. Default values loaded at init phase.
#

# server socket port
[SOCKET_SERVER]
port = 50880

#Start transcription by key word (for example "alexa")
[WAKEWORD]
enabled = true
# model = alexa
model = alexa_v0.1.onnx
threshold = 0.5
listen_timeout = 6
max_active = 30
end_on_phrase = true
followup = 0

# Speech to text.
# Vad (Voice Activity Detection) Silero model (in Model directory)
# Speech to text Vosk model (it exist in form of directory inside Model directory)
[STT]
dir_Vosk_Model = vosk-model-small-it-0.22

# Text to speech.
# Piper vocalizer model (in Model directory)
# N.B. Model directory has to include also the companion file ...onnx.json
# But it must been specified the only one onnx file (the software reaches the companion)
[TTS]
Piper_Model = it_IT-paola-medium.onnx
length_scale = 1.5
noise_scale = 0.7
noise_w_scale = 0.8
pitch = 1.0




